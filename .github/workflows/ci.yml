name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libio-socket-ssl-perl

      - name: Run deterministic checks
        run: make check
